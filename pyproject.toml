[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marian-uk-verbalizer"
version = "0.1.0"
description = "Marian-based Ukrainian text verbalization experiment"
requires-python = ">=3.10,<3.11"
dependencies = [
  "num2words==0.5.14",
  "pyarrow==20.0.0",
  "PyYAML==6.0.3",
  "sentencepiece==0.2.1",
  "torch==2.12.1",
  "transformers==4.30.2",
  "mlflow>=2.22,<3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
ui = ["gradio==6.19.0"]
mlops = ["dvc[s3]>=3.0,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
