# E54 = E53 + 7,668 Roman agreement rows rebalanced to the accusative (3,487)
# and possessive genitive (2,421), light datv/ablt/loct/nomn refresher
# (data/e54_roman_balance). E53's dative/instrumental data pushed accusatives
# to -ому/-ій ("прочитати XX розділ" -> "двадцятому"; accs 92 -> 87%).
# Held-out roman_case frames are never used.
experiment_name: e54-roman-balance
seed: 5401
train_data: data/e54_roman_balance/train.parquet
validation_data: data/e54_roman_balance/dev-stratified.parquet
output_dir: outputs/e54-roman-balance
tokenizer: artifacts/tokenizers/spm-16k
model_config: configs/model/marian-base-scaled.yaml
input_preprocessing: model-routing-v1
epochs: 2
learning_rate: 0.00005
weight_decay: 0.01
warmup_ratio: 0.02
label_smoothing: 0.0
max_source_tokens: 384
max_target_tokens: 384
max_batch_tokens: 4096
max_batch_examples: 16
gradient_accumulation_steps: 2
gradient_clipping: 1.0
precision: bf16
num_workers: 0
log_steps: 500
eval_steps: 3000
eval_max_batches: 128
save_steps: 3000
