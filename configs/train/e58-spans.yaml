# E58: E57 plus a ruler's name before a Roman regnal number in every case (data/e58_roman_names, doubled),
# abbreviations before a capitalised word ("вул. Шевченка"), a short final abbreviation ("сьогодні ср."),
# stretched words ("смачнооо") and abbreviation chains before an emoji in the span detector.
experiment_name: e58-spans
seed: 5501
train_data: data/e58_spans/train.parquet
validation_data: data/e58_spans/dev.parquet
output_dir: outputs/e58-spans
tokenizer: artifacts/tokenizers/spm-16k
model_config: configs/model/marian-base-scaled.yaml
input_preprocessing: raw
epochs: 2
learning_rate: 0.00005
weight_decay: 0.01
warmup_ratio: 0.02
label_smoothing: 0.0
max_source_tokens: 192
max_target_tokens: 96
max_batch_tokens: 8192
max_batch_examples: 64
gradient_accumulation_steps: 1
gradient_clipping: 1.0
precision: bf16
num_workers: 0
log_steps: 200
eval_steps: 3000
eval_max_batches: 64
save_steps: 10000
